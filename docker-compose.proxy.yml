services:
  markdown-converter:
    build: 
      context: .
      dockerfile: server/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    container_name: markdown-converter
    restart: always
    networks:
      - markdown-converter-network
    volumes:
      - ./server/downloads:/app/downloads
      - ./server/temp:/app/temp
    environment:
      - NODE_ENV=production
      - GIT_COMMIT_HASH=${GIT_COMMIT:-unknown}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  markdown-converter-network:
    external: true
    name: nginx-proxy-manager