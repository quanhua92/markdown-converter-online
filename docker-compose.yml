services:
  markdown-converter:
    build: 
      context: .
      dockerfile: server/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GIT_COMMIT_HASH=${GIT_COMMIT:-unknown}
    volumes:
      - ./server/downloads:/app/downloads
      - ./server/temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s